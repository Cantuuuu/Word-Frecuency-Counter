# docker-compose.yml — Orquestación local: Ambassador + worker_local + Coordinator
#
# Para la demo en red:
#   - Levantar este archivo en tu laptop (Ambassador + Coordinator).
#   - En cada laptop worker: docker run con AMBASSADOR_URL y WORKER_URL.
#   - No se necesita .env — los workers se registran solos al arrancar.

services:

  # ---------------------------------------------------------------------------
  # Ambassador — recibe registros de workers y despacha chunks
  # ---------------------------------------------------------------------------
  ambassador:
    build:
      context: .
      dockerfile: Dockerfile.ambassador
    ports:
      - "5005:5005"
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Worker local — para pruebas en una sola laptop sin red real
  # ---------------------------------------------------------------------------
  worker_local:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - "5001:5001"
    environment:
      WORKER_ID:      "worker_local"
      AMBASSADOR_URL: "http://ambassador:5005"
      WORKER_URL:     "http://worker_local:5001"
    volumes:
      - ./wiki_es.txt:/app/data/input.txt:ro
    depends_on:
      ambassador:
        condition: service_healthy
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Coordinator — espera workers, divide archivo y despacha chunks
  # ---------------------------------------------------------------------------
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    ports:
      - "4999:4999"
    environment:
      AMBASSADOR_URL: "http://ambassador:5005"
      FILE_PATH:      "/app/wiki_es.txt"
    volumes:
      - ./wiki_es.txt:/app/wiki_es.txt:ro
    depends_on:
      ambassador:
        condition: service_healthy
    restart: on-failure
